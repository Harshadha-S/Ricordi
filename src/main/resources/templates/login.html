<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Ricordi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<header class="site-header"><a class="brand" th:href="@{/}">Ricordi</a></header>
<main class="paper-card">
    <h1>Welcome back</h1>
    <p>Return to the moments you have gathered.</p>
    <p th:if="${param.error}" role="alert">Those sign-in details were not recognized.</p>
    <p th:if="${param.logout}">You have signed out.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
